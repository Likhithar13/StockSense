services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: stocksense
      POSTGRES_USER: stocksense
      POSTGRES_PASSWORD: stocksense_dev_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stocksense -d stocksense"]
      interval: 5s
      timeout: 5s
      retries: 10
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql+psycopg://stocksense:stocksense_dev_password@db:5432/stocksense
      SECRET_KEY: local-development-secret-change-me
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
